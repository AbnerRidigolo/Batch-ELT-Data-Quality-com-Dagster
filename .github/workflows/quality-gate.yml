name: Dagster quality gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
      SODA_TELEMETRY_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Dagster, dbt and Soda
        run: |
          python -m pip install 'dagster-dbt==0.29.30' 'dbt-core==1.10.23' 'dbt-duckdb==1.11.1' 'duckdb==1.0.0' pandas pytest
          python -m venv "$RUNNER_TEMP/soda"
          "$RUNNER_TEMP/soda/bin/python" -m pip install 'soda-core-duckdb==3.5.6' setuptools
          mkdir "$RUNNER_TEMP/soda-cli"
          ln -s "$RUNNER_TEMP/soda/bin/soda" "$RUNNER_TEMP/soda-cli/soda"
          echo "$RUNNER_TEMP/soda-cli" >> "$GITHUB_PATH"
      - name: Compile dbt assets
        run: dbt parse --project-dir dbt_project --profiles-dir dbt_project
      - name: Validate rejected Bronze data and the successful pipeline
        run: python -m pytest -q
